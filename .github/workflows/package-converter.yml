name: Build converter-only software archive

# This job packages only source code and docs. It neither checks out
# upstream Greek data nor publishes any generated Text-Fabric dataset.
# Cancel only superseded validation for the SAME pull request.
# Independent PRs, push checks and manually requested builds stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converter-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run data-free archive regression tests
        run: python -m unittest discover -s tests -p 'test_package_converter*.py' -v
      - name: Produce first clean code-only archive
        run: python -m scripts.package_converter --output "$RUNNER_TEMP/sblgnt-converter-first.zip"
      - name: Independently generate second archive
        run: python -m scripts.package_converter --output "$RUNNER_TEMP/sblgnt-converter-second.zip"
      - name: Verify reproducible software bytes and manifest
        run: |
          cmp "$RUNNER_TEMP/sblgnt-converter-first.zip" "$RUNNER_TEMP/sblgnt-converter-second.zip"
          python -m scripts.package_converter --verify "$RUNNER_TEMP/sblgnt-converter-first.zip"
      - name: RED/green isolated Git software tag candidate unit tests
        run: python -m unittest discover -s tests -p 'test_release_tag_staging.py' -v
      - name: Stage and independently verify data-free Git tag from real ZIP
        run: |
          python -m release.stage_software_tag \
            --source-root . \
            --archive "$RUNNER_TEMP/sblgnt-converter-first.zip" \
            --destination "$RUNNER_TEMP/software-tag-preview" \
            --tag converter-v0.1.0-rc1 > "$RUNNER_TEMP/software-tag-preview.json"
          python -m release.stage_software_tag \
            --source-root . \
            --archive "$RUNNER_TEMP/sblgnt-converter-first.zip" \
            --destination "$RUNNER_TEMP/software-tag-preview" \
            --tag converter-v0.1.0-rc1 --verify-only > /dev/null
          git -C "$RUNNER_TEMP/software-tag-preview" archive --format=zip \
            --output="$RUNNER_TEMP/software-tag-archive.zip" converter-v0.1.0-rc1
          mkdir "$RUNNER_TEMP/software-tag-extracted"
          unzip -q "$RUNNER_TEMP/software-tag-archive.zip" \
            -d "$RUNNER_TEMP/software-tag-extracted"
          (cd "$RUNNER_TEMP/software-tag-extracted" && \
            PYTHONPATH= python -m scripts.query_unified_tf --help > /dev/null && \
            PYTHONPATH= python -m scripts.build_unified_tf --help > /dev/null)
      - name: Publish only independently verified converter software
        uses: actions/upload-artifact@v4
        with:
          name: sblgnt-converter-software-only
          path: ${{ runner.temp }}/sblgnt-converter-first.zip
          if-no-files-found: error
