name: Legacy remote TF compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release/smoke_legacy_remote.py'
      - 'tests/test_smoke_legacy_remote.py'
      - '.github/workflows/legacy-remote-smoke.yml'
      - 'app/config.yaml'
      - 'tf/2022/**'
      - 'docs/CONVERTER_RELEASE.md'
permissions:
  contents: read
jobs:
  legacy-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [default, pinned]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression contracts
        run: python -m unittest discover -s tests -p 'test_smoke_legacy_remote.py' -v
      - name: Install pinned native client
        run: python -m pip install text-fabric==13.1.0
      - name: Fetch historical app and corpus into a fresh temporary cache
        env:
          GHPERS: ${{ github.token }}
        run: python -m release.smoke_legacy_remote --mode ${{ matrix.mode }}
