name: Build pinned MorphGNT base TF

# Only obsolete runs for the same PR are cancelled. Each push/manual run
# has its own run ID to avoid disrupting release and diagnostic validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  source-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact MorphGNT revision
        uses: actions/checkout@v4
        with:
          repository: morphgnt/sblgnt
          ref: aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
          path: upstream-morphgnt
          persist-credentials: false
      - name: Checkout pinned historical MorphGNT 2018 comparison baseline
        uses: actions/checkout@v4
        with:
          repository: morphgnt/sblgnt
          ref: 8b11a5be0a5cdad16c82e3d029e79ad0b0b9e4b4
          path: upstream-morphgnt-legacy
          persist-credentials: false
      - name: Checkout pinned Faithlife SBLGNT v1.2 text
        uses: actions/checkout@v4
        with:
          repository: Faithlife/SBLGNT
          ref: c4d241a9c1c479a55b989ba35a4976c1d0b8052c
          path: upstream-faithlife
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all converter and audit tests
        run: python -m unittest discover -s tests -v
      - name: Guard inherited 31-feature lineage inventory
        run: python -m scripts.feature_provenance --tf-dir tf/2022 --report "$RUNNER_TEMP/legacy-feature-lineage.json"
      - name: Audit exact Greek NT edition reference differences
        run: python -m scripts.compare_faithlife_refs --morphgnt-dir upstream-morphgnt --faithlife-dir upstream-faithlife --report "$RUNNER_TEMP/faithlife-v12-reference-diff.json"
      - name: Audit all shared Greek NT verse readings across editions
        run: python -m scripts.compare_faithlife_text --morphgnt-dir upstream-morphgnt --faithlife-dir upstream-faithlife --report "$RUNNER_TEMP/faithlife-v12-text-diff.json"
      - name: Independently verify all 27 official XML book structures and reconstruct Greek verses
        run: python -m scripts.faithlife_xml --source-dir upstream-faithlife --report "$RUNNER_TEMP/faithlife-xml-parity.json"
      - name: Verify exact full Faithlife critical apparatus XML/TXT notes and scripture anchors
        run: python -m scripts.faithlife_apparatus --source-dir upstream-faithlife --report "$RUNNER_TEMP/faithlife-apparatus-source.json"
      - name: Install pinned Text-Fabric
        run: python -m pip install text-fabric==13.1.0
      - name: Audit historical TF 2022 structure
        run: python -m scripts.audit_tf --tf-dir tf/2022 --report "$RUNNER_TEMP/legacy-tf-structure.json"
      - name: Compare historical TF verses with pinned MorphGNT 2024 source
        run: python -m scripts.compare_morphgnt --tf-dir tf/2022 --source-dir upstream-morphgnt --report "$RUNNER_TEMP/legacy-source-coverage.json"
      - name: Require exact historical word and lemma identity
        run: python -m scripts.compare_tokens --tf-dir tf/2022 --source-dir upstream-morphgnt-legacy --source-commit 8b11a5be0a5cdad16c82e3d029e79ad0b0b9e4b4 --report "$RUNNER_TEMP/legacy-2018-lexical-parity.json"
      - name: Require exactly the 18 documented 2024 accent corrections
        run: python -m scripts.compare_tokens --tf-dir tf/2022 --source-dir upstream-morphgnt --source-commit aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d --expect-2024-accent-corrections --report "$RUNNER_TEMP/legacy-2024-lexical-parity.json"
      - name: Convert immutable real 27-book upstream source
        run: python -m scripts.build_base_tf --source-dir upstream-morphgnt --source-commit aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d --output "$RUNNER_TEMP/sblgnt-generated"
      - name: Clean reload and check native book/chapter/verse/word partition
        run: python -m scripts.audit_tf --tf-dir "$RUNNER_TEMP/sblgnt-generated" --no-2022-baseline --report "$RUNNER_TEMP/base-structure-audit.json"
      - name: Verify every Greek source word and lemma after real conversion
        run: python -m scripts.compare_tokens --tf-dir "$RUNNER_TEMP/sblgnt-generated" --source-dir upstream-morphgnt --source-commit aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d --report "$RUNNER_TEMP/base-token-parity.json"
      - name: Independently verify all raw source columns and combined morphology
        run: python -m scripts.audit_base_fields --source-dir upstream-morphgnt --source-commit aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d --tf-dir "$RUNNER_TEMP/sblgnt-generated" --report "$RUNNER_TEMP/base-all-fields-audit.json"
      - name: Check every derived morph_* feature against pinned source code
        run: python -m scripts.audit_derived_morphology --source-dir upstream-morphgnt --source-commit aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d --tf-dir "$RUNNER_TEMP/sblgnt-generated" --report "$RUNNER_TEMP/base-derived-morphology-audit.json"
      - name: Build official pinned Faithlife text-only TF candidate
        run: python -m scripts.build_faithlife_text_tf --source-dir upstream-faithlife --output "$RUNNER_TEMP/faithlife-text-tf"
      - name: Independently audit Faithlife text/verse/token spans after native TF reload
        run: python -m scripts.audit_faithlife_text_tf --source-dir upstream-faithlife --tf-dir "$RUNNER_TEMP/faithlife-text-tf" --report "$RUNNER_TEMP/faithlife-text-tf-audit.json"
      - name: Build source-pinned edition-qualified Faithlife apparatus Text-Fabric candidate
        run: python -m scripts.build_faithlife_apparatus_tf --source-dir upstream-faithlife --output "$RUNNER_TEMP/faithlife-apparatus-tf"
      - name: Independently reload every original apparatus note and verse coordinate
        run: python -m scripts.audit_faithlife_apparatus_tf --source-dir upstream-faithlife --tf-dir "$RUNNER_TEMP/faithlife-apparatus-tf" --report "$RUNNER_TEMP/faithlife-apparatus-tf-audit.json"
      - name: Build authoritative Faithlife XML-word TF and preserve paragraph metadata
        run: python -m scripts.build_faithlife_xml_tf --source-dir upstream-faithlife --output "$RUNNER_TEMP/faithlife-xml-word-tf"
      - name: Independently reload all official XML words, prefixes, suffixes and paragraphs
        run: python -m scripts.audit_faithlife_xml_tf --source-dir upstream-faithlife --tf-dir "$RUNNER_TEMP/faithlife-xml-word-tf" --report "$RUNNER_TEMP/faithlife-xml-word-tf-audit.json"
      - name: Upload only source-free audit counts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morphgnt-base-conversion-audits
          path: |
            ${{ runner.temp }}/legacy-tf-structure.json
            ${{ runner.temp }}/legacy-source-coverage.json
            ${{ runner.temp }}/legacy-2018-lexical-parity.json
            ${{ runner.temp }}/legacy-2024-lexical-parity.json
            ${{ runner.temp }}/legacy-feature-lineage.json
            ${{ runner.temp }}/faithlife-v12-reference-diff.json
            ${{ runner.temp }}/faithlife-v12-text-diff.json
            ${{ runner.temp }}/faithlife-text-tf-audit.json
            ${{ runner.temp }}/faithlife-xml-parity.json
            ${{ runner.temp }}/faithlife-xml-word-tf-audit.json
            ${{ runner.temp }}/faithlife-apparatus-source.json
            ${{ runner.temp }}/faithlife-apparatus-tf-audit.json
            ${{ runner.temp }}/base-structure-audit.json
            ${{ runner.temp }}/base-token-parity.json
            ${{ runner.temp }}/base-all-fields-audit.json
            ${{ runner.temp }}/base-derived-morphology-audit.json
          if-no-files-found: ignore
