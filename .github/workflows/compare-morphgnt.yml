name: Compare pinned MorphGNT source and legacy TF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout maintained SBLGNT TF
        uses: actions/checkout@v4
      - name: Checkout immutable MorphGNT input
        uses: actions/checkout@v4
        with:
          repository: morphgnt/sblgnt
          ref: aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
          path: upstream-morphgnt
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regress source and corpus inventory checks
        run: python -m unittest discover -s tests -v
      - name: Install pinned Text-Fabric runtime
        run: python -m pip install text-fabric==13.1.0
      - name: Compare pinned source and native TF references
        run: python -m scripts.compare_morphgnt --tf-dir tf/2022 --source-dir upstream-morphgnt --report "$RUNNER_TEMP/morphgnt-comparison.json"
      - name: Preserve counts and evidence, never source text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphgnt-reference-comparison
          path: ${{ runner.temp }}/morphgnt-comparison.json
          if-no-files-found: ignore
