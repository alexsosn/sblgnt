name: Audit pinned MorphGNT token identity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lexical-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          repository: morphgnt/sblgnt
          ref: aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d
          path: upstream-morphgnt
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test identity audit counterexamples
        run: python -m unittest discover -s tests -v
      - name: Install pinned Text-Fabric
        run: python -m pip install text-fabric==13.1.0
      - name: Compare source word/lemma sequences against native TF
        run: python -m scripts.compare_tokens --tf-dir tf/2022 --source-dir upstream-morphgnt --report "$RUNNER_TEMP/morphgnt-token-parity.json"
      - name: Preserve evidence without copyrighted Greek text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphgnt-token-parity
          path: ${{ runner.temp }}/morphgnt-token-parity.json
          if-no-files-found: ignore
